[tasks.test-fs-engine]
description = "Run tests for fs_engine crate"
category = "Testing"
command = "cargo"
args = ["test", "-p", "fs_engine"]

[tasks.test-ini-forge]
description = "Run tests for ini_forge crate"
category = "Testing"
command = "cargo"
args = ["test", "-p", "ini_forge"]

[tasks.test-integration]
description = "Run tests for integration_tests crate"
category = "Testing"
command = "cargo"
args = ["test", "-p", "integration_tests"]

[tasks.test-librarian]
description = "Run tests for librarian crate"
category = "Testing"
command = "cargo"
args = ["test", "-p", "librarian"]

[tasks.test-loader-ctl]
description = "Run tests for loader_ctl crate"
category = "Testing"
command = "cargo"
args = ["test", "-p", "loader_ctl"]

[tasks.test-logic-weaver]
description = "Run tests for logic_weaver crate"
category = "Testing"
command = "cargo"
args = ["test", "-p", "logic_weaver"]

[tasks.test-proc-marshal]
description = "Run tests for proc_marshal crate"
category = "Testing"
command = "cargo"
args = ["test", "-p", "proc_marshal"]

[tasks.test-sophon-engine]
description = "Run tests for sophon_engine crate"
category = "Testing"
command = "cargo"
args = ["test", "-p", "sophon_engine"]

# --- Release Infrastructure ---

[tasks.init-release]
description = "Prepare release directories"
category = "Release"
script_runner = "@duckscript"
script = [
    "mkdir ${RELEASE_DIR}",
    "mkdir ${LATEST_DIR}",
    "mkdir ${OLDER_DIR}",
    "mkdir ${BUILD_ROOT}",
    "mkdir ${TEMP_BUILD_DIR}",
    "mkdir ${BUILD_ROOT}/deb",
    "mkdir ${BUILD_ROOT}/rpm",
    "mkdir ${BUILD_ROOT}/windows",
    "mkdir ${BUILD_ROOT}/appimage",
    "mkdir ${BUILD_ROOT}/flatpak",
    "mkdir ${BUILD_ROOT}/pkgbuild"
]

[tasks.organize-artifact]
description = "Organize a build artifact with timestamp"
category = "Release"
private = true
script_runner = "@duckscript"
script = [
    "assert_set ${ARTIFACT_PATH}",
    "assert_set ${ARTIFACT_TYPE}",
    "filename = basename ${ARTIFACT_PATH}",
    "timestamp = exec date +%Y%m%d_%H%M%S",
    "timestamp = set ${timestamp.stdout}",
    "name = set ${filename}",
    "ext = set \"\"",
    
    # Simple extension splitting
    "is_pkg = contains ${filename} .pkg.tar.zst",
    "if ${is_pkg}",
    "  ext = set \"pkg.tar.zst\"",
    "else",
    "  ext = set \"\"", # Simplified for duckscript
    "end",

    "echo Organizing ${filename} into ${LATEST_DIR} and ${OLDER_DIR}/${ARTIFACT_TYPE}",
    "cp ${ARTIFACT_PATH} ${LATEST_DIR}/${filename}",
    "mkdir ${OLDER_DIR}/${ARTIFACT_TYPE}",
    "mv ${ARTIFACT_PATH} ${OLDER_DIR}/${ARTIFACT_TYPE}/${filename}_${timestamp}"
]

# --- Release Packaging (Phase 3) ---

[tasks.release-linux-artifacts]
description = "Build all Linux bundles in one pass (DEB, RPM, AppImage, Flatpak, PKGBUILD)"
category = "Release"
dependencies = ["init-release"]
script = [
    "export APPIMAGE_EXTRACT_AND_RUN=1",
    "export NO_STRIP=1",
    "echo '📦 Building Primary Linux Bundles (Tauri)...'",
    "cd src-tauri",
    "cargo tauri build --bundles deb,rpm,appimage",
    "cp ../target/release/bundle/deb/*.deb ../release/latest/",
    "cp ../target/release/bundle/rpm/*.rpm ../release/latest/",
    "find ../target/release/bundle/appimage/ -name \"*.AppImage\" -exec cp {} ../release/latest/YAGO-x86_64.AppImage \\;",
    "cd ..",
    "echo '📦 Building Flatpak bundle...'",
    "rm -rf release/build/flatpak/build",
    "flatpak-builder --force-clean --user --install-deps-from=flathub --repo=release/build/flatpak/repo release/build/flatpak/build release/build/flatpak/io.github.niraash_code.YAGO.json",
    "flatpak build-bundle release/build/flatpak/repo release/latest/yago.flatpak io.github.niraash_code.YAGO",
    "echo '📦 Building PKGBUILD (Arch Linux)...'",
    "VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = \"\\(.*\\)\"/\\1/')",
    "DEB_NAME=\"yago_${VERSION}_amd64.deb\"",
    "cp target/release/bundle/deb/${DEB_NAME} release/build/pkgbuild/",
    "echo '🛠️ Running makepkg inside yago-arch...'",
    "distrobox enter yago-arch -- bash -c \"cd release/build/pkgbuild && makepkg -f --nodeps\"",
    "cp release/build/pkgbuild/*.pkg.tar.zst release/latest/",
    "cp release/build/pkgbuild/PKGBUILD release/latest/",
    "echo '✅ All Linux artifacts ready in release/latest/'"
]

[tasks.release-deb]
description = "Build DEB package"
category = "Release"
dependencies = ["init-release"]
script = [
    "cd src-tauri",
    "cargo tauri build --bundles deb",
    "cp ../target/release/bundle/deb/*.deb ../release/latest/"
]

[tasks.release-rpm]
description = "Build RPM package"
category = "Release"
dependencies = ["init-release"]
script = [
    "cd src-tauri",
    "cargo tauri build --bundles rpm",
    "cp ../target/release/bundle/rpm/*.rpm ../release/latest/"
]

[tasks.release-windows]
description = "Build Windows EXE (Native)"
category = "Release"
dependencies = ["init-release", "build"]
script_runner = "powershell"
script_extension = "ps1"
script = [
    "$ErrorActionPreference = 'Stop'",
    "Write-Host 'Building YAGO for Windows...'",
    "cd src-tauri",
    "npx tauri build --bundles nsis",
    "cd ..",
    "Write-Host 'Windows build complete. Organizing artifacts...'",
    "if (!(Test-Path \"release/latest\")) { New-Item -ItemType Directory -Path \"release/latest\" -Force }",
    "Copy-Item -Path \"target/release/yago.exe\" -Destination \"release/latest/yago-portable.exe\" -Force",
    "$setupExe = Get-ChildItem -Path \"target/release/bundle/nsis\" -Filter \"*.exe\" -Recurse | Select-Object -First 1",
    "if ($setupExe) { ",
    "  Copy-Item -Path $setupExe.FullName -Destination \"release/latest/yago-setup.exe\" -Force ",
    "  Write-Host \"✅ Setup artifact copied: $($setupExe.Name)\"",
    "} else { ",
    "  Write-Error '❌ Could not find Windows Setup EXE in target/release/bundle/nsis'",
    "}",
    "Write-Host '🎉 Windows artifacts ready in release/latest/'"
]

[tasks.release-appimage]
description = "Build AppImage"
category = "Release"
dependencies = ["init-release", "build"]
script = [
    "export NO_STRIP=1",
    "export APPIMAGE_EXTRACT_AND_RUN=1",
    "cd src-tauri",
    "cargo tauri build --bundles appimage",
    "cp ../target/release/bundle/appimage/*.AppImage ../release/latest/YAGO-x86_64.AppImage"
]

[tasks.release-flatpak]
description = "Build Flatpak"
category = "Release"
dependencies = ["init-release"]
script = [
    "rm -rf release/build/flatpak/build",
    "flatpak-builder --force-clean --user --install-deps-from=flathub --repo=release/build/flatpak/repo release/build/flatpak/build release/build/flatpak/io.github.niraash_code.YAGO.json",
    "flatpak build-bundle release/build/flatpak/repo release/latest/yago.flatpak io.github.niraash_code.YAGO"
]

[tasks.release-pkgbuild]
description = "Build PKGBUILD package"
category = "Release"
dependencies = ["init-release"]
script = [
    "VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = \"\\(.*\\)\"/\\1/')",
    "DEB_NAME=\"yago_${VERSION}_amd64.deb\"",
    "cp target/release/bundle/deb/${DEB_NAME} release/build/pkgbuild/",
    "echo '🛠️ Running makepkg inside yago-arch...'",
    "distrobox enter yago-arch -- bash -c \"cd release/build/pkgbuild && makepkg -f --nodeps\"",
    "cp release/build/pkgbuild/*.pkg.tar.zst release/latest/",
    "cp release/build/pkgbuild/PKGBUILD release/latest/"
]

[tasks.release-all]
description = "Build all release packages"
category = "Release"
dependencies = [
    "release-appimage",
    "release-deb",
    "release-rpm",
    "release-pkgbuild",
    "release-windows"
]

[tasks.release-list]
description = "List current release builds"
category = "Release"
script = ["ls -la release/latest/ || echo 'No releases found.'"]

[tasks.finish-appimage]
description = "Manually complete AppImage creation if tool fails"
category = "Release"
script = [
    "echo 🔧 Completing YAGO AppImage build manually...",
    "if [ ! -d \"release/build/appimage/AppDir\" ]; then echo '❌ AppDir not found'; exit 1; fi",
    "if [ ! -f \"appimagetool-x86_64.AppImage\" ]; then wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage; chmod +x appimagetool-x86_64.AppImage; fi",
    "./appimagetool-x86_64.AppImage \"release/build/appimage/AppDir\"",
    "APPIMAGE_FILE=$(ls -t *.AppImage | head -1)",
    "mkdir -p release/latest",
    "mv \"$APPIMAGE_FILE\" release/latest/",
    "echo '🎉 AppImage ready in release/latest/'"
]

