[config]
skip_core_tasks = true
load_cargo_aliases = false

[env]
VERSION = { script = ["grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/version = \"\\(.*\\)\"/\\1/'"] }
RELEASE_DIR = "release"
LATEST_DIR = "${RELEASE_DIR}/latest"
OLDER_DIR = "${RELEASE_DIR}/older"
BUILD_ROOT = "${RELEASE_DIR}/build"
TEMP_BUILD_DIR = "${BUILD_ROOT}/temp"

[tasks.default]
alias = "help"

[tasks.help]
description = "List all available tasks"
category = "Development"
command = "cargo"
args = ["make", "--list-all-steps"]

# --- Development Tasks ---

[tasks.watch]
description = "Watch for changes and run check/test"
category = "Development"
command = "cargo"
args = ["watch", "-x", "check", "-x", "nextest"]

[tasks.test]
description = "Run all tests using nextest"
category = "Development"
command = "cargo"
args = ["nextest", "run"]

[tasks.review]
workspace = false
description = "Review backend snapshots"
category = "Development"
command = "cargo"
args = ["insta", "review"]

[tasks.lint]
description = "Run clippy and check formatting"
category = "Development"
dependencies = ["format-check", "clippy"]

[tasks.format-check]
description = "Check code formatting"
category = "Development"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.clippy]
description = "Run clippy with warnings treated as errors"
category = "Development"
command = "cargo"
args = ["clippy", "--all-targets", "--all-features", "--", "-D", "warnings"]

[tasks.ci]
description = "Full CI suite: Format, Lint, Test, and Bench"
category = "Development"
dependencies = ["lint", "test", "bench"]

[tasks.bench]
description = "Run backend benchmarks"
category = "Development"
command = "cargo"
args = ["bench"]

# --- Setup Tasks (Phase 2) ---

[tasks.setup]
description = "Initialize development environment"
category = "Setup"
dependencies = [
    "check-requirements",
    "init-env",
    "npm-install",
    "setup-welcome"
]

[tasks.check-requirements]
description = "Verify core dependencies are installed"
category = "Setup"
script_runner = "@duckscript"
script = [
    "exit_on_error true",
    "echo Checking core requirements...",
    "exec --fail-on-error rustc --version",
    "exec --fail-on-error node --version",
    "exec --fail-on-error npm --version",
    "exec --fail-on-error cargo tauri --version",
]

[tasks.init-env]
description = "Initialize .env file from example"
category = "Setup"
script_runner = "@duckscript"
script = [
    "is_env_exists = is_path_exists .env",
    "if not ${is_env_exists}",
    "  echo Creating .env from .env.example...",
    "  cp .env.example .env",
    "else",
    "  echo .env already exists, skipping creation.",
    "end"
]

[tasks.npm-install]
description = "Install all dependencies"
category = "Setup"
script = [
    "echo Installing root dependencies...",
    "bun install",
    "echo Installing frontend dependencies...",
    "cd src-ui && bun install"
]

[tasks.setup-welcome]
description = "Final welcome message"
category = "Setup"
script = [
    "echo ''",
    "echo '================================================'",
    "echo '   🎉 YAGO Environment Setup Complete! 🎉'",
    "echo '================================================'",
    "echo ''",
    "echo 'Next steps:'",
    "echo '  cargo make dev    - Start development mode'",
    "echo '  cargo make test   - Run test suite'",
    "echo ''",
    "echo 'For release building details, see docs/dev/release-system.md'"
]

# --- Platform Specific Setup (Optional) ---

[tasks.setup-linux]
description = "Initialize Distrobox containers for compatible Linux builds"
category = "Setup"
condition = { platforms = ["linux"] }
dependencies = ["setup-linux-deb", "setup-linux-rpm", "setup-linux-arch"]

[tasks.setup-linux-deb]
description = "Setup Debian container for DEB builds"
condition = { platforms = ["linux"] }
script = [
    "if ! distrobox list | grep -q 'yago-deb'; then",
    "  echo '🐳 Creating yago-deb (Debian 12)...'",
    "  distrobox create -n yago-deb --image debian:12 --yes",
    "fi",
    "echo '🛠️  Updating yago-deb packages...'",
    "distrobox enter yago-deb -- bash -c 'sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y curl build-essential libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config protobuf-compiler libxdo-dev'",
    "echo '🦀 Checking Rust in yago-deb...'",
    "distrobox enter yago-deb -- bash -c 'command -v rustc || (curl --proto \"=https\" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y)'",
    "echo '📦 Checking Node.js in yago-deb...'",
    "distrobox enter yago-deb -- bash -c 'command -v node || (curl -fsSL https://deb.nodesource.com/setup_20.x | sudo bash - && sudo apt-get install -y nodejs)'",
    "echo '🚀 Checking tauri-cli in yago-deb (Compile step - please wait)...'",
    "distrobox enter yago-deb -- bash -c 'export PATH=\"$HOME/.cargo/bin:$PATH\" && command -v cargo-tauri || cargo install tauri-cli'"
]

[tasks.setup-linux-rpm]
description = "Setup Fedora container for RPM builds"
condition = { platforms = ["linux"] }
script = [
    "if ! distrobox list | grep -q 'yago-rpm'; then",
    "  echo '🐳 Creating yago-rpm (Fedora 38)...'",
    "  distrobox create -n yago-rpm --image fedora:38 --yes",
    "fi",
    "echo '🛠️  Updating yago-rpm packages...'",
    "distrobox enter yago-rpm -- bash -c 'sudo dnf groupinstall -y \"Development Tools\" && sudo dnf install -y webkit2gtk4.1-devel libappindicator-gtk3-devel librsvg2-devel openssl-devel protobuf-compiler libxdo-devel pkgconf-pkg-config'",
    "echo '🦀 Checking Rust in yago-rpm...'",
    "distrobox enter yago-rpm -- bash -c 'command -v rustc || (curl --proto \"=https\" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y)'",
    "echo '📦 Checking Node.js in yago-rpm...'",
    "distrobox enter yago-rpm -- bash -c 'command -v node || (curl -fsSL https://rpm.nodesource.com/setup_20.x | sudo bash - && sudo dnf install -y nodejs)'",
    "echo '🚀 Checking tauri-cli in yago-rpm (Compile step - please wait)...'",
    "distrobox enter yago-rpm -- bash -c 'export PATH=\"$HOME/.cargo/bin:$PATH\" && command -v cargo-tauri || cargo install tauri-cli'"
]

[tasks.setup-linux-arch]
description = "Setup Arch container for AppImage/PKGBUILD"
condition = { platforms = ["linux"] }
script = [
    "if ! distrobox list | grep -q 'yago-arch'; then",
    "  echo '🏔️  Creating yago-arch (Arch Linux)...'",
    "  distrobox create -n yago-arch --image archlinux:latest --yes",
    "fi",
    "echo '🛠️  Updating yago-arch packages...'",
    "distrobox enter yago-arch -- bash -c 'sudo pacman -Syu --noconfirm base-devel rustup nodejs npm wget fuse2 libappindicator-gtk3 openssl protobuf xdotool pkgconf squashfs-tools'",
    "echo '📦 Installing linuxdeploy in yago-arch...'",
    "distrobox enter yago-arch -- bash -c 'sudo curl -L https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o /usr/local/bin/linuxdeploy && sudo chmod +x /usr/local/bin/linuxdeploy'",
    "echo '🦀 Checking Rust in yago-arch...'",
    "distrobox enter yago-arch -- bash -c 'rustup default stable'",
    "echo '🚀 Checking tauri-cli in yago-arch (Compile step - please wait)...'",
    "distrobox enter yago-arch -- bash -c 'command -v cargo-tauri || cargo install tauri-cli'"
]

[tasks.setup-windows]
description = "Additional setup steps for Windows"
category = "Setup"
condition = { platforms = ["windows"] }
script = [
    "echo Checking Windows specific tools...",
    "rustup target add x86_64-pc-windows-msvc",
    "echo 'Ensure NSIS is installed for .exe bundling.'"
]

[tasks.dev]
workspace = false
description = "Start development mode"
category = "Development"
command = "bun"
args = ["run", "tauri:dev"]

[tasks.build]
description = "Build for production"
category = "Development"
script = [
    "bun run build"
]

[tasks.check]
description = "Check Rust code"
category = "Development"
command = "cargo"
args = ["check"]

[tasks.clean]
description = "Clean build artifacts"
category = "Development"
script = [
    "cargo clean",
    "rm -rf src-ui/dist",
    "rm -rf src-tauri/target"
]

